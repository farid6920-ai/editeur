<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editeur de boutique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --e-bg:#F6F5F2;
  --e-panel:#FFFFFF;
  --e-ink:#20181C;
  --e-ink-soft:#6B6167;
  --e-line:#E6E1DA;
  --e-accent:#6B3FA0;
  --e-accent-soft:#EFE7F7;
  --e-danger:#C4432B;
  --e-radius:14px;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; background:var(--e-bg); color:var(--e-ink); font-family:'Work Sans', -apple-system, sans-serif; height:100%; }
h1,h2,h3{ font-family:'Fraunces', Georgia, serif; margin:0; }

.app{ display:flex; flex-direction:column; height:100vh; }

.topbar{
  padding:14px 18px;
  background:var(--e-panel);
  border-bottom:1px solid var(--e-line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.topbar h1{ font-size:18px; font-weight:600; }
.topbar .subtitle{ font-size:12px; color:var(--e-ink-soft); margin-top:2px; }
.topbar-btn{
  background:var(--e-accent);
  color:#fff;
  border:none;
  padding:10px 16px;
  border-radius:999px;
  font-weight:600;
  font-size:13px;
  cursor:pointer;
  white-space:nowrap;
}
.topbar-btn:active{ transform:scale(0.97); }

.body-wrap{
  flex:1;
  display:flex;
  min-height:0;
}

.form-col{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  border-right:1px solid var(--e-line);
}

.tabs{
  display:flex;
  overflow-x:auto;
  background:var(--e-panel);
  border-bottom:1px solid var(--e-line);
  flex-shrink:0;
}
.tab{
  padding:12px 14px;
  font-size:13px;
  font-weight:600;
  color:var(--e-ink-soft);
  background:none;
  border:none;
  cursor:pointer;
  white-space:nowrap;
  border-bottom:2px solid transparent;
}
.tab.active{ color:var(--e-accent); border-bottom-color:var(--e-accent); }

.panels{ flex:1; overflow-y:auto; padding:18px; }
.panel.hidden{ display:none; }
.panel h3{ font-size:14px; margin:18px 0 8px; color:var(--e-ink); }
.panel h3:first-child{ margin-top:0; }

.field{ display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
.field-label{ font-size:12.5px; font-weight:600; color:var(--e-ink-soft); }
.field input[type="text"], .field input[type="number"], .field textarea, .field select{
  padding:10px 12px;
  border:1.5px solid var(--e-line);
  border-radius:10px;
  font-size:14px;
  font-family:inherit;
  background:#fff;
  color:var(--e-ink);
}
.field textarea{ resize:vertical; }
.field-help{ font-size:11px; color:var(--e-ink-soft); }

.color-field .color-row{ display:flex; gap:8px; align-items:center; }
.color-row input[type="color"]{
  width:44px; height:38px; border:1.5px solid var(--e-line); border-radius:8px; padding:2px; background:#fff; cursor:pointer;
}
.hex-input{ flex:1; padding:10px 12px; border:1.5px solid var(--e-line); border-radius:10px; font-size:13px; font-family:'IBM Plex Mono', monospace; }

.tip{ font-size:12px; color:var(--e-ink-soft); margin-top:10px; }

.field-image .image-picker{ display:flex; align-items:center; gap:12px; }
.image-preview{
  width:56px; height:56px; border-radius:12px; object-fit:cover; flex-shrink:0;
  border:1.5px solid var(--e-line); background:#fff;
}
.image-preview.empty{
  display:flex; align-items:center; justify-content:center;
  font-size:10px; color:var(--e-ink-soft); text-align:center; padding:4px;
}
.image-picker-actions{ display:flex; gap:8px; flex-wrap:wrap; }
.file-btn{ display:inline-block; cursor:pointer; }
.url-fallback{
  margin-top:8px; padding:8px 10px; border:1.5px solid var(--e-line); border-radius:8px;
  font-size:12px; color:var(--e-ink-soft);
}

.github-status{ margin-top:12px; font-size:13px; padding:10px 12px; border-radius:10px; display:none; }
.github-status:empty{ display:none; }
.github-status.pending{ display:block; background:#EFE7F7; color:var(--e-accent); }
.github-status.success{ display:block; background:#E6F4EA; color:#1E7A34; }
.github-status.error{ display:block; background:#FBEAE5; color:var(--e-danger); }

.card-item{
  background:var(--e-panel);
  border:1.5px solid var(--e-line);
  border-radius:var(--e-radius);
  padding:14px;
  margin-bottom:14px;
}
.card-item-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.card-item-head strong{ font-size:13px; }

.btn-primary, .btn-secondary, .btn-danger{
  border:none;
  border-radius:999px;
  font-weight:600;
  cursor:pointer;
  font-family:inherit;
}
.btn-primary{ background:var(--e-accent); color:#fff; padding:11px 18px; font-size:13.5px; width:100%; }
.btn-primary.big{ padding:14px 20px; font-size:14.5px; }
.btn-secondary{ background:var(--e-accent-soft); color:var(--e-accent); padding:9px 14px; font-size:12.5px; }
.btn-danger{ background:#FBEAE5; color:var(--e-danger); padding:6px 12px; font-size:12px; }
.btn-danger.small, .btn-secondary.small{ padding:6px 10px; font-size:11.5px; }

.tiers-wrap{ display:flex; flex-direction:column; gap:8px; margin-bottom:8px; }
.tier-row{ display:flex; gap:8px; align-items:center; }
.tier-row input[type="text"]{ flex:2; padding:9px 10px; border:1.5px solid var(--e-line); border-radius:8px; font-size:13px; }
.tier-row input[type="number"]{ flex:1; padding:9px 10px; border:1.5px solid var(--e-line); border-radius:8px; font-size:13px; }

.row-item{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.row-item input, .row-item textarea, .row-item select{
  flex:1; padding:9px 10px; border:1.5px solid var(--e-line); border-radius:8px; font-size:13px; font-family:inherit;
}

.preview-col{
  width:380px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#EDEAE4;
  padding:24px;
}
.phone{
  width:320px;
  height:660px;
  background:#0B0710;
  border-radius:38px;
  border:8px solid #1a1a1a;
  box-shadow:0 20px 50px rgba(0,0,0,0.25);
  overflow:hidden;
  position:relative;
}
.phone iframe{ width:100%; height:100%; border:none; }

@media (max-width: 900px){
  .body-wrap{ flex-direction:column; }
  .form-col{ border-right:none; border-bottom:1px solid var(--e-line); order:2; }
  .preview-col{ width:100%; padding:16px; order:1; height:340px; }
  .phone{ width:180px; height:320px; border-radius:22px; border-width:5px; }
  .panels{ max-height:60vh; }
}

</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <h1>Editeur de boutique</h1>
      <div class="subtitle">Modifie ta boutique, l'apercu se met a jour a droite</div>
    </div>
  </div>
  <div class="body-wrap">
    <div class="form-col">
      <div class="tabs">
        <button class="tab" id="tab-boutique">Boutique</button>
        <button class="tab" id="tab-couleurs">Couleurs</button>
        <button class="tab" id="tab-categories">Categories</button>
        <button class="tab" id="tab-produits">Produits</button>
        <button class="tab" id="tab-autres">Infos / Liens / Avis</button>
        <button class="tab" id="tab-github">GitHub</button>
        <button class="tab" id="tab-export">Telecharger</button>
      </div>
      <div class="panels">
        <div class="panel" id="panel-boutique"></div>
        <div class="panel hidden" id="panel-couleurs"></div>
        <div class="panel hidden" id="panel-categories"></div>
        <div class="panel hidden" id="panel-produits"></div>
        <div class="panel hidden" id="panel-autres"></div>
        <div class="panel hidden" id="panel-github"></div>
        <div class="panel hidden" id="panel-export"></div>
      </div>
    </div>
    <div class="preview-col">
      <div class="phone">
        <iframe id="previewFrame" title="Apercu de la boutique"></iframe>
      </div>
    </div>
  </div>
</div>

        '      desc:'+esc(p.desc)+',\n' +
        '      tiers:['+tiers+'] }';
    }).join(',\n');
    return 'var PRODUCTS = [\n'+rows+'\n  ];';
  }

  var HEADER_HTML =
    '<header>\n' +
    '  <img id="shopLogo" class="hidden" alt="" style="width:44px;height:44px;border-radius:12px;object-fit:cover;margin-bottom:10px;box-shadow:0 6px 18px rgba(0,0,0,0.35);">\n' +
    '  <div class="eyebrow" id="eyebrowText"></div>\n' +
    '  <h1 class="logo" id="shopNameText"></h1>\n' +
    '  <p class="tagline" id="taglineText"></p>\n' +
    '</header>';

  var RENDER_HEADER_JS =
    "  function renderHeader(){\n" +
    "    document.getElementById('eyebrowText').textContent = CONFIG.eyebrow;\n" +
    "    document.getElementById('shopNameText').textContent = CONFIG.shopName;\n" +
    "    document.getElementById('taglineText').textContent = CONFIG.tagline;\n" +
    "    document.title = CONFIG.shopName;\n" +
    "    var logoEl = document.getElementById('shopLogo');\n" +
    "    if (CONFIG.logo) { logoEl.src = CONFIG.logo; logoEl.classList.remove('hidden'); }\n" +
    "    else { logoEl.classList.add('hidden'); }\n" +
    "  }";

  function buildOutput(){
    var html = BASE.full;
    html = html.replace(BASE.root, buildRootBlock(state.colors));
    html = html.replace(BASE.config, buildConfigBlock(state));
    html = html.replace(BASE.cats, buildCatsBlock(state.cats));
    html = html.replace(BASE.products, buildProductsBlock(state.products));
    html = html.replace(BASE.header, HEADER_HTML);
    html = html.replace(BASE.renderHeader, RENDER_HEADER_JS);
    return html;
  }

  // ---------- Aperçu ----------
  var previewTimer = null;
  function schedulePreview(){
    if (previewTimer) clearTimeout(previewTimer);
    previewTimer = setTimeout(updatePreview, 250);
  }
  function updatePreview(){
    var frame = el('previewFrame');
    frame.srcdoc = buildOutput();
  }

  // ---------- Onglets ----------
  var tabs = ['boutique','couleurs','categories','produits','autres','github','export'];
  function showTab(name){
    tabs.forEach(function(t){
      el('tab-'+t).classList.toggle('active', t===name);
      el('panel-'+t).classList.toggle('hidden', t!==name);
    });
  }
  tabs.forEach(function(t){
    el('tab-'+t).addEventListener('click', function(){ showTab(t); });
  });

  // ---------- Rendu : Boutique ----------
  function renderBoutique(){
    el('panel-boutique').innerHTML =
      field('Nom de la boutique', 'identite.shopName', state.identite.shopName, 'text', "Affiché en grand en haut de la boutique") +
      field('Petit texte au-dessus du nom', 'identite.eyebrow', state.identite.eyebrow, 'text', '') +
      fieldTextarea('Description courte (tagline)', 'identite.tagline', state.identite.tagline) +
      field('Numéro WhatsApp', 'identite.whatsappNumber', state.identite.whatsappNumber, 'text', "Format international sans le \u201c+\u201d, exemple : 33612345678 pour 06 12 34 56 78") +
      fieldImage('Logo (optionnel)', 'identite.logo', state.identite.logo);
    bindListSection(el('panel-boutique'));
  }

  function field(label, path, value, type, help){
    return '<label class="field">' +
      '<span class="field-label">'+escapeHtml(label)+'</span>' +
      '<input type="'+(type||'text')+'" data-bind="'+path+'" value="'+escapeHtml(value)+'">' +
      (help ? '<span class="field-help">'+escapeHtml(help)+'</span>' : '') +
      '</label>';
  }
  function fieldTextarea(label, path, value){
    return '<label class="field">' +
      '<span class="field-label">'+escapeHtml(label)+'</span>' +
      '<textarea data-bind="'+path+'" rows="3">'+escapeHtml(value)+'</textarea>' +
      '</label>';
  }

  function fieldImage(label, path, value){
    var isData = value && value.indexOf('data:') === 0;
    var urlVal = isData ? '' : (value || '');
    return '<div class="field field-image">' +
      '<span class="field-label">'+escapeHtml(label)+'</span>' +
      '<div class="image-picker">' +
        (value ? '<img class="image-preview" src="'+value+'" alt="">' : '<div class="image-preview empty">Pas de photo</div>') +
        '<div class="image-picker-actions">' +
          '<label class="btn-secondary small file-btn">Choisir une photo<input type="file" accept="image/*" data-image-input="'+path+'" hidden></label>' +
          (value ? '<button type="button" class="btn-danger small" data-action="clear-image" data-image-path="'+path+'">Retirer</button>' : '') +
        '</div>' +
      '</div>' +
      '<input type="text" class="url-fallback" placeholder="ou colle un lien URL d\u2019image" data-bind="'+path+'" value="'+escapeHtml(urlVal)+'">' +
    '</div>';
  }

  function imageMaxDim(path){
    return path.indexOf('identite.logo') === 0 ? 420 : 1100;
  }

  function loadAndResizeImage(file, maxDim, callback){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale));
        var ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, cw, ch);
        var dataUrl = canvas.toDataURL('image/jpeg', 0.82);
        callback(dataUrl);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function refreshOwnerTab(path){
    if (path.indexOf('identite.') === 0) renderBoutique();
    else if (path.indexOf('cats.') === 0) renderCategories();
    else if (path.indexOf('products.') === 0) renderProducts();
  }

  // ---------- Rendu : Couleurs ----------
  var colorMeta = [
    ['bg', 'Fond général', 'La couleur de fond principale de la boutique'],
    ['card', 'Fond des cartes produits', ''],
    ['ink', 'Couleur du texte', ''],
    ['lime', 'Couleur du nom de la boutique', "Utilisée aussi pour les prix"],
    ['pink', 'Couleur des boutons (1/2)', "Les boutons utilisent un dégradé entre ces 2 couleurs"],
    ['purple', 'Couleur des boutons (2/2)', ''],
    ['cyan', 'Couleur du bandeau du haut', '']
  ];
  function renderColors(){
    var html = colorMeta.map(function(m){
      var key = m[0], label = m[1], help = m[2];
      var val = state.colors[key];
      return '<label class="field color-field">' +
        '<span class="field-label">'+escapeHtml(label)+'</span>' +
        '<span class="color-row">' +
          '<input type="color" data-bind="colors.'+key+'" value="'+val+'">' +
          '<input type="text" data-bind="colors.'+key+'" data-pair="1" value="'+val+'" class="hex-input">' +
        '</span>' +
        (help ? '<span class="field-help">'+escapeHtml(help)+'</span>' : '') +
        '</label>';
    }).join('');
    el('panel-couleurs').innerHTML = html + '<p class="tip">Astuce : touche la pastille pour choisir une couleur avec le sélecteur, ou tape directement un code (ex. #FF2E9A).</p>';

    // Sync color + text pairs
    var wrap = el('panel-couleurs');
    wrap.querySelectorAll('[data-bind]').forEach(function(input){
      input.addEventListener('input', function(){
        var path = input.getAttribute('data-bind');
        setPath(state, path, input.value);
        wrap.querySelectorAll('[data-bind="'+path+'"]').forEach(function(other){
          if (other !== input) other.value = input.value;
        });
        schedulePreview();
      });
    });
  }

  // ---------- Rendu : Catégories ----------
  function renderCategories(){
    var html = state.cats.map(function(c, i){
      return '<div class="card-item">' +
        '<div class="card-item-head">' +
          '<strong>Catégorie ' + (i+1) + '</strong>' +
          '<button class="btn-danger" data-action="remove-cat" data-index="'+i+'">Supprimer</button>' +
        '</div>' +
        field('Nom de la catégorie', 'cats.'+i+'.label', c.label) +
        field('Sous-titre', 'cats.'+i+'.sub', c.sub) +
        field('Emoji (si pas de photo)', 'cats.'+i+'.icon', c.icon) +
        fieldImage('Photo (optionnel)', 'cats.'+i+'.photo', c.photo) +
        '<label class="field color-field">' +
          '<span class="field-label">Couleur de la catégorie</span>' +
          '<span class="color-row">' +
            '<input type="color" data-bind="cats.'+i+'.accent" value="'+c.accent+'">' +
            '<input type="text" data-bind="cats.'+i+'.accent" data-pair="1" value="'+c.accent+'" class="hex-input">' +
          '</span>' +
        '</label>' +
      '</div>';
    }).join('');
    html += '<button class="btn-primary" data-action="add-cat">+ Ajouter une catégorie</button>';
    el('panel-categories').innerHTML = html;
    bindListSection(el('panel-categories'));
  }

  // ---------- Rendu : Produits ----------
  function catOptions(selected){
    return state.cats.map(function(c){
      return '<option value="'+escapeHtml(c.id)+'"'+(c.id===selected?' selected':'')+'>'+escapeHtml(c.label)+'</option>';
    }).join('');
  }
  function renderProducts(){
    var html = state.products.map(function(p, i){
      var tiersHtml = p.tiers.map(function(t, ti){
        return '<div class="tier-row">' +
          '<input type="text" placeholder="Poids / format (ex. 5g)" data-bind="products.'+i+'.tiers.'+ti+'.label" value="'+escapeHtml(t.label)+'">' +
          '<input type="number" step="0.01" placeholder="Prix" data-bind="products.'+i+'.tiers.'+ti+'.price" value="'+t.price+'">' +
          '<button class="btn-danger small" data-action="remove-tier" data-index="'+i+'" data-tier="'+ti+'">✕</button>' +
        '</div>';
      }).join('');
      return '<div class="card-item">' +
        '<div class="card-item-head">' +
          '<strong>Produit ' + (i+1) + '</strong>' +
          '<button class="btn-danger" data-action="remove-product" data-index="'+i+'">Supprimer</button>' +
        '</div>' +
        field('Nom du produit', 'products.'+i+'.name', p.name) +
        '<label class="field">' +
          '<span class="field-label">Catégorie</span>' +
          '<select data-bind="products.'+i+'.cat" data-select="1">'+catOptions(p.cat)+'</select>' +
        '</label>' +
        field('Info sous le nom (origine, format...)', 'products.'+i+'.farm', p.farm) +
        field('Badge (ex. 12%, laisser vide pour ne rien afficher)', 'products.'+i+'.cbd', p.cbd) +
        fieldTextarea('Description', 'products.'+i+'.desc', p.desc) +
        field('Emoji (si pas de photo)', 'products.'+i+'.icon', p.icon) +
        fieldImage('Photo (optionnel)', 'products.'+i+'.image', p.image) +
        '<div class="field-label">Poids / formats et prix</div>' +
        '<div class="tiers-wrap">' + tiersHtml + '</div>' +
        '<button class="btn-secondary small" data-action="add-tier" data-index="'+i+'">+ Ajouter un format</button>' +
      '</div>';
    }).join('');
    html += '<button class="btn-primary" data-action="add-product">+ Ajouter un produit</button>';
    el('panel-produits').innerHTML = html;
    bindListSection(el('panel-produits'));
  }

  // ---------- Rendu : Autres (infos, liens, avis) ----------
  function renderAutres(){
    var infoHtml = state.info.map(function(p, i){
      return '<div class="row-item">' +
        '<textarea rows="2" data-bind="info.'+i+'">'+escapeHtml(p)+'</textarea>' +
        '<button class="btn-danger small" data-action="remove-info" data-index="'+i+'">✕</button>' +
      '</div>';
    }).join('');
    var linksHtml = state.links.map(function(l, i){
      return '<div class="row-item">' +
        '<input type="text" placeholder="Nom du bouton" data-bind="links.'+i+'.label" value="'+escapeHtml(l.label)+'">' +
        '<input type="text" placeholder="Lien (ou \u201cwhatsapp\u201d)" data-bind="links.'+i+'.url" value="'+escapeHtml(l.url)+'">' +
        '<button class="btn-danger small" data-action="remove-link" data-index="'+i+'">✕</button>' +
      '</div>';
    }).join('');
    var reviewsHtml = state.reviews.map(function(r, i){
      return '<div class="row-item">' +
        '<select data-bind="reviews.'+i+'.stars" data-select="1">' +
          [1,2,3,4,5].map(function(n){ return '<option value="'+n+'"'+(n===r.stars?' selected':'')+'>'+n+' etoile'+(n>1?'s':'')+'</option>'; }).join('') +
        '</select>' +
        '<input type="text" data-bind="reviews.'+i+'.text" value="'+escapeHtml(r.text)+'">' +
        '<button class="btn-danger small" data-action="remove-review" data-index="'+i+'">✕</button>' +
      '</div>';
    }).join('');

    el('panel-autres').innerHTML =
      '<h3>Page Infos</h3>' + infoHtml +
      '<button class="btn-secondary small" data-action="add-info">+ Ajouter un paragraphe</button>' +
      '<h3>Page Liens</h3>' + linksHtml +
      '<button class="btn-secondary small" data-action="add-link">+ Ajouter un lien</button>' +
      '<h3>Page Avis</h3>' + reviewsHtml +
      '<button class="btn-secondary small" data-action="add-review">+ Ajouter un avis</button>';
    bindListSection(el('panel-autres'));
  }

  // ---------- Liaison générique pour les sections listes ----------
  function bindListSection(container){
    container.querySelectorAll('[data-bind]').forEach(function(input){
      var evt = (input.tagName === 'SELECT') ? 'change' : 'input';
      input.addEventListener(evt, function(){
        var path = input.getAttribute('data-bind');
        var val = input.value;
        if (input.type === 'number') val = parseFloat(val) || 0;
        if (input.getAttribute('data-select') === '1' && input.type !== 'color') {
          // stars as int
          if (path.indexOf('.stars') !== -1) val = parseInt(val, 10);
        }
        setPath(state, path, val);
        if (input.hasAttribute('data-pair') || input.type === 'color'){
          container.querySelectorAll('[data-bind="'+path+'"]').forEach(function(other){
            if (other !== input) other.value = input.value;
          });
        }
        // If a category label changed, refresh product category dropdown labels
        if (path.indexOf('cats.') === 0 && path.indexOf('.label') !== -1){
          renderProducts();
        }
        schedulePreview();
      });
    });
    container.querySelectorAll('[data-action]').forEach(function(btn){
      btn.addEventListener('click', function(){ handleAction(btn); });
    });
    container.querySelectorAll('input[type="file"][data-image-input]').forEach(function(input){
      input.addEventListener('change', function(){
        var file = input.files && input.files[0];
        if (!file) return;
        var path = input.getAttribute('data-image-input');
        loadAndResizeImage(file, imageMaxDim(path), function(dataUrl){
          setPath(state, path, dataUrl);
          refreshOwnerTab(path);
          schedulePreview();
        });
      });
    });
  }

  function handleAction(btn){
    var action = btn.getAttribute('data-action');
    var index = parseInt(btn.getAttribute('data-index'), 10);
    if (action === 'add-cat'){
      var label = 'Nouvelle categorie';
      state.cats.push({ id: uniqueId(label, state.cats), label: label, sub: '', icon: '\u{1F4E6}', photo: '', accent: '#9B3CFF' });
      renderCategories(); renderProducts();
    } else if (action === 'remove-cat'){
      if (state.cats.length <= 1){ alert('Il doit rester au moins une categorie.'); return; }
      var removedId = state.cats[index].id;
      state.cats.splice(index, 1);
      var fallback = state.cats[0].id;
      state.products.forEach(function(p){ if (p.cat === removedId) p.cat = fallback; });
      renderCategories(); renderProducts();
    } else if (action === 'add-product'){
      var firstCat = state.cats[0] ? state.cats[0].id : '';
      state.products.push({ id: 'p-' + Date.now(), cat: firstCat, icon: '\u{1F4E6}', image: '', name: 'Nouveau produit', farm: '', cbd: '', desc: '', tiers: [{label:'Unite', price:0}] });
      renderProducts();
    } else if (action === 'remove-product'){
      state.products.splice(index, 1);
      renderProducts();
    } else if (action === 'add-tier'){
      state.products[index].tiers.push({ label:'', price:0 });
      renderProducts();
    } else if (action === 'remove-tier'){
      var tierIdx = parseInt(btn.getAttribute('data-tier'), 10);
      var tiers = state.products[index].tiers;
      if (tiers.length <= 1){ alert('Il doit rester au moins un format.'); return; }
      tiers.splice(tierIdx, 1);
      renderProducts();
    } else if (action === 'add-info'){
      state.info.push('');
      renderAutres();
    } else if (action === 'remove-info'){
      state.info.splice(index, 1);
      renderAutres();
    } else if (action === 'add-link'){
      state.links.push({ label: '', url: '' });
      renderAutres();
    } else if (action === 'remove-link'){
      state.links.splice(index, 1);
      renderAutres();
    } else if (action === 'add-review'){
      state.reviews.push({ stars: 5, text: '' });
      renderAutres();
    } else if (action === 'remove-review'){
      state.reviews.splice(index, 1);
      renderAutres();
    } else if (action === 'clear-image'){
      var imgPath = btn.getAttribute('data-image-path');
      setPath(state, imgPath, '');
      refreshOwnerTab(imgPath);
    }
    schedulePreview();
  }

  // ---------- Publication GitHub ----------
  function utf8ToB64(str){
    var bytes = new TextEncoder().encode(str);
    var binary = '';
    var chunkSize = 0x8000;
    for (var i=0; i<bytes.length; i+=chunkSize){
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunkSize));
    }
    return btoa(binary);
  }

  function renderGithub(){
    var g = state.github;
    el('panel-github').innerHTML =
      '<p>Publie directement le site sur ton dépôt GitHub, sans passer par un téléchargement manuel.</p>' +
      field('Nom d\u2019utilisateur ou organisation GitHub', 'github.owner', g.owner, 'text', '') +
      field('Nom du dépôt', 'github.repo', g.repo, 'text', "Le dépôt qui contient ton site, par exemple mon-boutique") +
      field('Branche', 'github.branch', g.branch, 'text', "Généralement \u201cmain\u201d") +
      field('Chemin du fichier', 'github.path', g.path, 'text', "Généralement \u201cindex.html\u201d") +
      field('Token d\u2019accès personnel GitHub', 'github.token', g.token, 'password',
        'Sur github.com : Settings > Developer settings > Personal access tokens > Generate new token, avec la permission "repo". Le token n\u2019est jamais enregistré, il sert uniquement pendant cette session.') +
      '<button class="btn-primary big" id="publishBtn" type="button">Publier sur GitHub</button>' +
      '<div id="githubStatus" class="github-status"></div>';
    bindListSection(el('panel-github'));
    el('publishBtn').addEventListener('click', function(){ publishToGithub(); });
  }

  function setGithubStatus(msg, kind){
    var box = el('githubStatus');
    if (!box) return;
    box.textContent = msg;
    box.className = 'github-status' + (kind ? ' ' + kind : '');
  }

  function publishToGithub(){
    var g = state.github;
    if (!g.owner || !g.repo || !g.token){
      setGithubStatus('Merci de remplir au minimum le nom d\u2019utilisateur, le dépôt et le token.', 'error');
      return;
    }
    var path = (g.path || 'index.html').replace(/^\/+/, '');
    var branch = g.branch || 'main';
    var apiUrl = 'https://api.github.com/repos/' + encodeURIComponent(g.owner) + '/' + encodeURIComponent(g.repo) +
      '/contents/' + path.split('/').map(encodeURIComponent).join('/');
    var headers = {
      'Authorization': 'Bearer ' + g.token,
      'Accept': 'application/vnd.github+json'
    };

    setGithubStatus('Publication en cours\u2026', 'pending');

    fetch(apiUrl + '?ref=' + encodeURIComponent(branch), { headers: headers })
      .then(function(getResp){
        if (getResp.status === 200) return getResp.json().then(function(d){ return d.sha; });
        if (getResp.status === 404) return null;
        return getResp.json().catch(function(){ return {}; }).then(function(errData){
          throw new Error(errData.message || ('Erreur ' + getResp.status));
        });
      })
      .then(function(sha){
        var html = buildOutput();
        var body = {
          message: 'Mise a jour de la boutique via l\u2019editeur',
          content: utf8ToB64(html),
          branch: branch
        };
        if (sha) body.sha = sha;
        return fetch(apiUrl, {
          method: 'PUT',
          headers: Object.assign({ 'Content-Type': 'application/json' }, headers),
          body: JSON.stringify(body)
        });
      })
      .then(function(putResp){
        if (putResp.ok) {
          setGithubStatus('Publié avec succès sur GitHub \u2705', 'success');
        } else {
          return putResp.json().catch(function(){ return {}; }).then(function(errData){
            throw new Error(errData.message || ('Erreur ' + putResp.status));
          });
        }
      })
      .catch(function(e){
        setGithubStatus('Échec de la publication : ' + e.message, 'error');
      });
  }

  // ---------- Export ----------
  function renderExport(){
    el('panel-export').innerHTML =
      '<p>Quand ta boutique est prête, télécharge le fichier et mets-le en ligne (par exemple en remplaçant le fichier <code>index.html</code> de ton dépôt GitHub Pages).</p>' +
      '<button class="btn-primary big" id="downloadBtn">Télécharger le site (index.html)</button>' +
      '<p class="tip">Le fichier téléchargé est autonome : tu peux le renommer <code>index.html</code> et l\u2019envoyer directement sur GitHub Pages, Netlify, ou tout hébergement.</p>';
    el('downloadBtn').addEventListener('click', downloadOutput);
  }

  function downloadOutput(){
    var html = buildOutput();
    var blob = new Blob([html], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var name = slugify(state.identite.shopName || 'boutique');
    a.href = url;
    a.download = name + '.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }

  // ---------- Initialisation ----------
  function renderAll(){
    renderBoutique();
    renderColors();
    renderCategories();
    renderProducts();
    renderAutres();
    renderGithub();
    renderExport();
    updatePreview();
  }

  renderAll();
  showTab('boutique');
})();

</script>
